syntax = "proto3";

package svctl.v1;

option go_package = "github.com/sboon-gg/svctl/svctl";

service Servers {
  rpc Start(ServerOpts) returns (ServerInfo) {}
  rpc Stop(ServerOpts) returns (ServerInfo) {}
  rpc Register(RegisterServerOpts) returns (ServerInfo) {}
  rpc Status(ServerOpts) returns (ServerInfo) {}
  rpc Reset(ServerOpts) returns (ServerInfo) {}
}

message ServerOpts { string id = 1; }

message StartRequest { ServerOpts server = 1; }

enum ServerType {
  SERVER_TYPE_UNSPECIFIED = 0;
  SERVER_TYPE_LOCAL = 1;
  SERVER_TYPE_DOCKER = 2;
  SERVER_TYPE_SYSTEMD = 3;
}

message RegisterServerOpts {
  string id = 1;
  string settings_path = 2;
  ServerType type = 3;
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_REGISTERED = 1;
  STATUS_STARTING = 2;
  STATUS_STOPPING = 3;
}

enum State {
  STATE_UNSPECIFIED = 0;
  STATE_STOPPED = 1;
  STATE_RUNNING = 2;
}

message GameStatus {
  string hostname = 1;
  string port = 2;
  string gamemode = 3;
  string map_name = 4;
  int64 map_size = 5;
  int64 num_players = 6;
  int64 max_players = 7;
}

message ServerInfo {
  string path = 1;
  string settings_path = 2;
  Status status = 3;
  State desired_state = 4;
  State current_state = 5;
  GameStatus game_status = 6;
}
